const UNITS={u1:"Overview of Biology",u2:"Chemistry of Life",u3:"The Cell",u4:"Molecular Biology & Genetics",u5:"Evolution"};

const QUESTIONS=[
{id:"u1-1",u:"u1",c:"pos",d:1,ty:"mc",q:"A student notices that plants near a sunny window grow taller than plants kept in the center of a dim room. Which statement below is an observation rather than a hypothesis?",options:["Plants grow taller because they receive more light.","Plants near the window are taller than plants in the center of the room.","Increasing light exposure will increase plant height.","If a plant receives more light, then it will grow taller."],a:1,e:"An observation is a recorded fact about what was seen. The other three options all propose an explanation (a hypothesis) for why the pattern exists."},
{id:"u1-2",u:"u1",c:"sf",d:1,ty:"ms",q:"Which of the following are characteristics shared by essentially all living things? Select all that apply.",options:["Response to stimuli","Organization into one or more cells","Having a nervous system","Growth and development over time","Capacity to reproduce","Carrying out photosynthesis"],a:[0,1,3,4],e:"All life is organized into cells, responds to stimuli, grows/develops, and reproduces. A nervous system and photosynthesis are traits of some organisms, not a universal requirement for life."},
{id:"u1-3",u:"u1",c:"sys",d:2,ty:"match",q:"Match each domain of life to an example that belongs to it.",left:["Bacteria","Archaea","Eukarya"],options:["A skin bacterium that lacks a nucleus","An organism that thrives in a near-boiling hot spring, with distinct membrane chemistry","A sunflower, made of cells with a true nucleus"],a:[0,1,2],e:"Bacteria and Archaea are both prokaryotic domains but differ in cell chemistry and evolutionary history; Archaea often live in extreme environments. Eukarya includes all organisms whose cells have a true, membrane-bound nucleus."},
{id:"u1-4",u:"u1",c:"pos",d:3,ty:"sa",data:true,table:{h:["Fertilizer (g/L)","Avg. height after 4 weeks (cm)"],r:[["0","12"],["1","15"],["2","19"],["3","22"],["4","21"]]},q:"Five groups of tomato plants received 0 to 4 g/L of fertilizer, with every other condition held constant. Using the data, predict what might happen at 5 g/L if the trend from 3 to 4 g/L continued, and explain your reasoning in a sentence or two.",a:"Height likely drops further (toward ~18-19 cm or lower), because growth increased up to 3 g/L but already declined slightly at 4 g/L - a sign that fertilizer is becoming harmful (over-fertilization) rather than helpful beyond a certain concentration.",e:"Model answer shown above - compare your reasoning, do not just check the number."},

{id:"u2-1",u:"u2",c:"sf",d:1,ty:"mc",q:"An atom of carbon-14 differs from an atom of carbon-12 in which way?",options:["Number of protons","Number of neutrons","Number of electrons","Net electric charge"],a:1,e:"Isotopes of the same element always share the same number of protons (that is what defines the element) but differ in neutron number, which changes atomic mass."},
{id:"u2-2",u:"u2",c:"sf",d:2,ty:"ms",q:"Which statements correctly describe covalent or hydrogen bonds? Select all that apply.",options:["Covalent bonds involve sharing a pair of electrons between atoms.","Ionic bonds involve a complete transfer of electrons from one atom to another.","A hydrogen bond is a weak attraction between a partially positive hydrogen and a nearby electronegative atom such as O or N.","Covalent bonds form exclusively between a metal and a nonmetal."],a:[0,2],e:"The electron-transfer statement and the metal-nonmetal statement both describe ionic bonding, not covalent bonding (typically nonmetal-nonmetal)."},
{id:"u2-3",u:"u2",c:"em",d:2,ty:"mc",data:true,table:{h:["Form of water","Density (g/mL, near 0C)"],r:[["Ice (solid)","0.92"],["Liquid water","1.00"]]},q:"Based on the densities shown, which property of water best explains why lakes freeze from the top down, allowing fish to survive underneath in winter?",options:["High specific heat capacity","Strong cohesion between molecules","Ice being less dense than liquid water, so it floats","High surface tension"],a:2,e:"Because ice is less dense than liquid water, it floats and forms an insulating layer at the surface, while liquid water (and the life in it) remains below."},
{id:"u2-4",u:"u2",c:"info",d:2,ty:"match",q:"Match each macromolecule class to its basic building block.",left:["Proteins","Nucleic acids (DNA/RNA)","Carbohydrates","Lipids"],options:["Amino acids","Nucleotides","Monosaccharides (simple sugars)","Fatty acids and glycerol"],a:[0,1,2,3],e:"Each class of macromolecule is built from a characteristic small unit that is linked together (often by dehydration synthesis) to form larger polymers or complex molecules."},

{id:"u3-1",u:"u3",c:"sf",d:1,ty:"mc",q:"Which feature is found in prokaryotic cells but, unlike in eukaryotic cells, is not enclosed by its own membrane?",options:["The nucleoid region where DNA is located","The nucleus","A mitochondrion","The endoplasmic reticulum"],a:0,e:"Prokaryotes lack a membrane-bound nucleus; their DNA is concentrated in a region called the nucleoid, which has no surrounding membrane. Eukaryotes keep DNA inside a true, membrane-bound nucleus."},
{id:"u3-2",u:"u3",c:"sf",d:3,ty:"mc",data:true,table:{h:["Solution","Red blood cell volume change at 10 min"],r:[["Hypertonic saline","-18%"],["Isotonic saline","0%"],["Hypotonic saline","+22% (approaching lysis)"]]},q:"In the hypotonic solution, water primarily moves...",options:["out of the cell, by osmosis","into the cell, by osmosis","into the cell, by active transport","out of the cell, by facilitated diffusion of water"],a:1,e:"A hypotonic solution has a lower solute concentration outside the cell than inside, so water moves into the cell by osmosis, increasing cell volume and risking lysis (bursting)."},
{id:"u3-3",u:"u3",c:"em",d:2,ty:"ms",q:"Which of the following are steps that occur during aerobic cellular respiration?",options:["Glycolysis in the cytoplasm","The Krebs cycle in the mitochondrial matrix","Light-dependent reactions in the thylakoid membrane","The electron transport chain in the inner mitochondrial membrane","The Calvin cycle in the stroma"],a:[0,1,3],e:"Light-dependent reactions and the Calvin cycle are stages of photosynthesis, which happens in chloroplasts, not stages of cellular respiration."},
{id:"u3-4",u:"u3",c:"sys",d:2,ty:"sa",q:"Describe one key difference between mitosis and meiosis in terms of how many daughter cells are produced and how their genetic content compares to the parent cell.",a:"Mitosis produces two daughter cells that are genetically identical to the parent cell (same chromosome number, used for growth/repair). Meiosis produces four daughter cells with half the chromosome number of the parent (haploid gametes), and these cells are genetically varied due to crossing over and independent assortment.",e:"Model answer shown above."},

{id:"u4-1",u:"u4",c:"info",d:1,ty:"mc",q:"According to the central dogma of molecular biology, genetic information generally flows in which direction?",options:["Protein to RNA to DNA","DNA to RNA to protein","RNA to protein to DNA","Protein to DNA to RNA"],a:1,e:"The central dogma describes transcription (DNA to RNA) followed by translation (RNA to protein). Some exceptions exist, such as reverse transcription in certain viruses, but this is the general flow."},
{id:"u4-2",u:"u4",c:"info",d:2,ty:"ms",q:"Which statements about DNA replication are correct?",options:["It is semiconservative: each new double helix has one original strand and one newly made strand.","DNA polymerase synthesizes new strands only in the 5' to 3' direction.","Replication occurs during the G1 phase of the cell cycle.","A short RNA primer is needed before DNA polymerase can begin synthesizing a new strand."],a:[0,1,3],e:"DNA replication occurs during S phase, not G1. Replication is semiconservative, DNA polymerase only extends strands 5' to 3', and primers are required to start synthesis."},
{id:"u4-3",u:"u4",c:"info",d:2,ty:"mc",data:true,table:{h:["Cross","Expected phenotype ratio"],r:[["Tt x Tt (T = tall, dominant; t = short, recessive)","3 tall : 1 short"]]},q:"A cross between two heterozygous (Tt) pea plants produces 160 offspring. Based on the expected Mendelian ratio, about how many offspring should be short?",options:["40","80","120","160"],a:0,e:"A Tt x Tt cross is expected to produce offspring in a 3:1 ratio of tall to short. One quarter of 160 is 40, the expected number of short offspring."},
{id:"u4-4",u:"u4",c:"info",d:3,ty:"sa",q:"A new technique lets scientists edit a specific DNA sequence inside living cells. Based on the relationship between DNA sequence and protein structure, predict one possible downstream effect of successfully editing a gene's coding sequence, and explain your reasoning.",a:"Changing the DNA coding sequence can change the mRNA codons produced during transcription, which can change the amino acid sequence made during translation. This could alter the resulting protein's shape and function (for better or worse), which in turn could change a cell's or organism's traits, since the central dogma links DNA sequence to protein structure.",e:"Model answer shown above."},

{id:"u5-1",u:"u5",c:"evo",d:1,ty:"mc",q:"Natural selection acts most directly on which of the following?",options:["An individual's genotype, independent of any outward trait","An individual's observable traits (phenotype), through survival and reproduction","A population's gene pool, with no connection to individual traits","The structure of the genetic code (the codon table) itself"],a:1,e:"Selection acts on phenotypes, the traits that affect an individual's survival and reproductive success. Because phenotypes are often influenced by genotype, differential reproduction can shift allele frequencies in the population over generations."},
{id:"u5-2",u:"u5",c:"evo",d:2,ty:"match",q:"Match each type of evidence for evolution to a matching example.",left:["Comparative anatomy","Molecular evidence","Fossil record","Biogeography"],options:["Similar bone arrangements (e.g., forelimbs) that serve different functions across related species","Similarities in DNA or protein sequences among related species","A series of transitional fossils showing gradual change in a lineage over time","Closely related species found on nearby islands but not on distant, unconnected ones"],a:[0,1,2,3],e:"Each of these four evidence types independently supports common descent and change over time, and they are often strongest when considered together."},
{id:"u5-3",u:"u5",c:"evo",d:3,ty:"mc",data:true,table:{h:["Generation","% of population with resistant allele"],r:[["1","5%"],["2","9%"],["3","18%"],["4","34%"],["5","52%"]]},q:"A pesticide is introduced to a beetle population, and the resistant allele is tracked over five generations as shown. This pattern is best explained by...",options:["Genetic drift acting randomly on allele frequency","Natural selection favoring resistant beetles after pesticide exposure","Gene flow from a separate, unexposed population","A sudden increase in mutation rate"],a:1,e:"The steady, directional increase in a trait (resistance) that is clearly advantageous after a specific environmental change (the pesticide) is the signature of natural selection, not random drift, gene flow, or a mutation spike."},
{id:"u5-4",u:"u5",c:"pos",d:3,ty:"sa",q:"A news article claims a single new fossil discovery fully disproves evolution by natural selection. Evaluate this claim: what questions would you ask to assess its credibility, accuracy, and potential bias before accepting it?",a:"Useful questions include: Was this published in a peer-reviewed scientific journal, or only reported in media? Do other scientists in the field agree with this interpretation, or is it a single contested claim? Does the article explain the actual evidence, or just assert a conclusion? Could the source have a bias or motive for overstating the finding? One fossil rarely overturns a theory supported by many independent lines of evidence (genetics, anatomy, observed selection, etc.), so an extraordinary claim needs strong, well-corroborated evidence.",e:"Model answer shown above."}
];

const TOPICS={"u1-1":"Scientific method & variables","u1-2":"Characteristics of life","u1-3":"Levels of organization & domains","u1-4":"Scientific method & variables","u2-1":"Atoms, isotopes & ions","u2-2":"Bonds","u2-3":"Water & compounds","u2-4":"Macromolecules","u3-1":"Cell structure & theory","u3-2":"Membranes & transport","u3-3":"Cellular respiration","u3-4":"Cell division","u4-1":"Central dogma & gene expression","u4-2":"DNA & replication","u4-3":"Inheritance patterns","u4-4":"Biotechnology","u5-1":"Natural selection","u5-2":"Evidence for evolution","u5-3":"Natural selection","u5-4":"Evidence for evolution"};

QUESTIONS.push(
M("u1-5","u1","pos",2,"Scientific method & variables","Researchers test whether caffeine concentration changes the heart rate of water fleas. Caffeine concentration is the...",["independent variable","dependent variable","control group","constant"],0,"The independent variable is the factor the researcher deliberately changes. Heart rate is what is measured in response, so it is the dependent variable."),
M("u1-6","u1","pos",2,"Scientific method & variables","One group of mice receives a new drug and another receives an identical-looking sugar pill. The sugar-pill group is the...",["experimental group","control group","dependent variable","hypothesis"],1,"A control group is treated the same way except for the factor being tested, which gives a baseline for comparison."),
M("u1-7","u1","pos",1,"Types of reasoning & science","Concluding that all swans are white after seeing only white swans is an example of...",["inductive reasoning","deductive reasoning","applied science","a controlled experiment"],0,"Inductive reasoning moves from specific observations to a general conclusion, which a single new observation (a black swan) can overturn. Deductive reasoning goes from a general rule to a specific prediction."),
M("u1-8","u1","sys",1,"Levels of organization & domains","Which list orders levels of biological organization from smallest to largest?",["Organelle, cell, tissue, organ, organism","Cell, organelle, organ, tissue, organism","Tissue, cell, organ, organelle, organism","Organ, tissue, cell, organism, organelle"],0,"Organelles make up cells, cells form tissues, tissues form organs, and organs work together in an organism."),
M("u2-5","u2","sf",1,"Atoms, isotopes & ions","An atom that loses one electron becomes...",["a negatively charged ion","a positively charged ion","an isotope","a neutral molecule"],1,"Losing a negative electron leaves more protons than electrons, so the atom has a net positive charge (a cation)."),
M("u2-6","u2","sf",2,"Bonds","Sodium and chloride ions in table salt are held together mainly by which type of bond?",["Nonpolar covalent","Ionic","Hydrogen","Peptide"],1,"Sodium transfers an electron to chlorine, and the resulting oppositely charged ions attract each other in an ionic bond."),
M("u2-7","u2","sf",2,"Water & compounds","Water moving up a narrow tube against gravity depends mainly on which properties?",["Low specific heat and evaporation","Cohesion and adhesion","Density and freezing","Acidity and basicity"],1,"Cohesion (water sticking to water) and adhesion (water sticking to the tube walls), both due to hydrogen bonding, pull water upward. This underlies water transport in plants."),
M("u2-8","u2","em",2,"Macromolecules","Which macromolecule class is the main form of long-term energy storage in animals?",["Lipids (fats)","Proteins","Nucleic acids","Monosaccharides"],0,"Fats store more energy per gram than carbohydrates or proteins, so they work well for long-term storage. Simple sugars are used for quick energy."),
M("u3-5","u3","sf",1,"Cell structure & theory","Which statement is part of cell theory?",["All cells arise from pre-existing cells.","All cells have a nucleus.","All cells contain mitochondria.","Cells form spontaneously from nonliving matter."],0,"Cell theory says organisms are made of cells, the cell is the basic unit of life, and cells come only from existing cells. Prokaryotes lack a nucleus, so the statement that all cells have a nucleus is false."),
M("u3-6","u3","sf",2,"Membranes & transport","In the fluid mosaic model, the word mosaic refers to...",["a rigid layer of cellulose outside the membrane","the varied proteins and other molecules scattered through the phospholipid bilayer","a single layer of lipids","the pores in the nucleus"],1,"Phospholipids form a flexible, fluid bilayer, and diverse proteins, cholesterol and carbohydrates are embedded in it like the pieces of a mosaic."),
M("u3-7","u3","em",2,"Energy & enzymes","An enzyme speeds up a reaction by...",["adding energy to the reactants","lowering the activation energy","changing the overall energy released","being used up in the reaction"],1,"Enzymes lower the activation energy barrier. They are not consumed and do not change the energy difference between reactants and products."),
M("u3-8","u3","em",2,"Cellular respiration","Without oxygen, which process regenerates NAD+ so glycolysis can keep making a small amount of ATP?",["The Krebs cycle","The electron transport chain","Fermentation","The Calvin cycle"],2,"Fermentation (anaerobic) converts NADH back to NAD+, letting glycolysis continue, though it yields far less ATP than aerobic respiration."),
M("u3-9","u3","em",3,"Photosynthesis","CAM plants open their stomata at night mainly to...",["release oxygen faster","take in CO2 while losing less water","absorb more light","run the light-dependent reactions"],1,"CAM plants take in CO2 at night when it is cooler and store it in organic acids, then use it during the day with stomata closed. C4 plants instead separate the steps in space."),
M("u3-10","u3","sys",2,"Cell division","Chromosomes line up along the cell equator during which phase of mitosis?",["Prophase","Metaphase","Anaphase","Telophase"],1,"Metaphase aligns chromosomes at the cell equator. Anaphase then pulls sister chromatids apart."),
M("u4-5","u4","info",2,"Central dogma & gene expression","Where does transcription occur in a eukaryotic cell?",["Nucleus","Ribosome","Golgi apparatus","Lysosome"],0,"Transcription copies DNA into mRNA inside the nucleus; the mRNA then moves to ribosomes for translation."),
M("u4-6","u4","info",2,"Central dogma & gene expression","The mRNA codon AUG usually signals...",["the end of translation","the start of translation, coding for methionine","a splice site","the start of DNA replication"],1,"AUG is the usual start codon and codes for methionine. Stop codons (UAA, UAG, UGA) end translation."),
M("u4-7","u4","info",2,"Inheritance patterns","Crossing red-flowered and white-flowered plants gives all pink offspring. This pattern is...",["complete dominance","incomplete dominance","independent assortment","a point mutation"],1,"In incomplete dominance the heterozygote shows a blend of the two parental traits, unlike complete dominance where one allele masks the other."),
M("u4-8","u4","info",2,"Biotechnology","CRISPR-Cas9 is a tool used mainly to...",["make targeted cuts at a chosen DNA sequence","copy RNA into protein","sort cells by size","stain chromosomes"],0,"A guide RNA directs the Cas9 enzyme to a specific DNA sequence, where it cuts, allowing scientists to edit genes."),
M("u5-5","u5","evo",2,"Natural selection","Which condition is required for evolution by natural selection?",["Heritable variation in traits that affect survival or reproduction","Individuals changing their traits on purpose","All offspring surviving","Mutations appearing only when needed"],0,"Selection needs variation, inheritance of that variation, and differential survival or reproduction. Individuals do not evolve; populations do."),
M("u5-6","u5","evo",2,"Natural selection","Bacteria exposed to an antibiotic become mostly resistant after several generations because...",["each bacterium learns to resist it","resistant variants survive and reproduce more","the antibiotic causes helpful mutations","resistance gained by use is passed on"],1,"Resistant variants already exist by chance. The antibiotic removes susceptible cells, so resistant ones leave more offspring."),
M("u5-7","u5","evo",3,"Natural selection","What is the main role of mutation in evolution?",["It improves populations on purpose","It creates new alleles, adding variation that selection can act on","It removes harmful alleles","It prevents genetic drift"],1,"Mutation is the ultimate source of new alleles. It is random with respect to need; selection then sorts the variation."),

  <p><strong>Recommendations:</strong> ${recs(focus,untried,nm)}</p>${strong.length?`<p><strong>Strengths:</strong> ${strong.join("; ")}.</p>`:""}
  ${untried.length?`<p><strong>Not practiced yet:</strong> ${untried.join("; ")}.</p>`:""}

// ---------- question rendering (shared by bank + test run + review) ----------
function renderQuestionBlock(q,{mode,userAns,showAnswer}={}){
  const bm=bookmarks.has(q.id);
  let body="";
  if(q.data){
    body+=`<table><tr>${q.table.h.map(h=>`<th>${h}</th>`).join("")}</tr>${q.table.r.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  if(q.ty==="mc"){
    body+=q.options.map((o,i)=>{
      let cls="opt"; let checked=userAns===i?"checked":"";
      if(showAnswer){ if(i===q.a)cls+=" correct"; else if(i===userAns)cls+=" wrong"; }
      return `<label class="${cls}"><input type="radio" name="r_${q.id}" value="${i}" ${checked} ${showAnswer?"disabled":""}> ${escapeHtml(o)}</label>`;
    }).join("");
  } else if(q.ty==="ms"){
    const ua=userAns||[];
    body+=q.options.map((o,i)=>{
      let cls="opt"; let checked=ua.includes(i)?"checked":"";
      if(showAnswer){ if(q.a.includes(i))cls+=" correct"; else if(ua.includes(i))cls+=" wrong"; }
      return `<label class="${cls}"><input type="checkbox" name="c_${q.id}" value="${i}" ${checked} ${showAnswer?"disabled":""}> ${escapeHtml(o)}</label>`;
    }).join("");
  } else if(q.ty==="match"){
    const ua=userAns||{};
    body+=q.left.map((l,i)=>{
      const sel=ua[i];
      let mark="";
      if(showAnswer){ mark=(Number(sel)===q.a[i])?' <span style="color:var(--good)">correct</span>':' <span style="color:var(--bad)">not matched correctly</span>'; }
      return `<div class="row" style="justify-content:space-between;margin:.3em 0"><span>${escapeHtml(l)}</span>
        <select data-mi="${i}" name="m_${q.id}_${i}" ${showAnswer?"disabled":""}>
          <option value="">Choose...</option>
          ${q.options.map((o,j)=>`<option value="${j}" ${String(sel)===String(j)?"selected":""}>${escapeHtml(o)}</option>`).join("")}
        </select>${mark}</div>`;
    }).join("");
  } else if(q.ty==="sa"){
    body+=`<textarea data-sa="${q.id}" ${showAnswer?"readonly":""} placeholder="Type your answer here...">${userAns?escapeHtml(userAns):""}</textarea>`;
    if(!showAnswer){
      body+=`<div class="row" style="margin-top:.5em"><button class="btn secondary" data-reveal="${q.id}">Show model answer</button></div>`;
      body+=`<div class="explain hidden" data-model="${q.id}"><strong>Model answer:</strong> ${escapeHtml(q.a)}<div class="row" style="margin-top:.5em">
        <label class="inline">Self-score: <select data-selfpts="${q.id}"><option value="">Choose...</option>${Array.from({length:pts(q)+1},(_,i)=>`<option value="${i}" ${testState&&testState.saSelf&&testState.saSelf[q.id]===i?"selected":""}>${i} of ${pts(q)}</option>`).join("")}</select></label>
        </div></div>`;
    } else {
      body+=`<div class="explain"><strong>Model answer:</strong> ${escapeHtml(q.a)}</div>`;
    }
  }
  return `<div class="card qcard" data-qid="${q.id}">
    <div class="meta"><span>${UNITS[q.u]}</span><span>${COMP[q.c]}</span><span>${DIFF[q.d]}</span>${q.n?"<span>Class notes topic</span>":""}<span>${q.la?"LONG":q.ty.toUpperCase()}, ${pts(q)} pts</span>
      <button class="bookmark ${bm?'on':''}" data-bm="${q.id}" aria-label="Bookmark question" title="Bookmark">&#9733;</button></div>
    <p><strong>${escapeHtml(q.q)}</strong></p>
    ${body}
    ${mode==="bank"?`<div class="row" style="margin-top:.6em"><button class="btn secondary" data-check="${q.id}">Check answer</button></div>
      <div class="explain hidden" data-explain="${q.id}">${escapeHtml(q.e)}</div>`:""}
  </div>`;
}

function wireSetup(){

// ---------- test run ----------
function viewRun(){
  if(!testState){return `<div class="card"><p>No test in progress.</p><button class="btn" data-go="setup">Build a test</button></div>`;}
  const q=QUESTIONS.find(x=>x.id===testState.ids[testState.idx]);
  const pct=Math.round(100*(testState.idx)/testState.ids.length);
  return `<div class="progresswrap"><div class="row" style="justify-content:space-between"><span>Question ${testState.idx+1} of ${testState.ids.length}</span>${testState.timed?`<span id="timer">${fmtTime(testState.secondsLeft)}</span>`:""}</div>
    <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${pct}%"></div></div></div>
    ${renderQuestionBlock(q,{mode:"run",userAns:testState.answers[q.id]})}
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev-q" ${testState.idx===0?"disabled":""}>Previous</button>
      ${testState.idx<testState.ids.length-1?`<button class="btn" id="next-q">Next</button>`:`<button class="btn" id="finish-test">Finish test</button>`}
    </div>`;
}
function fmtTime(s){if(s==null)return"";const m=Math.floor(s/60),ss=s%60;return`${m}:${String(ss).padStart(2,"0")}`;}
function captureAnswer(q){
  const card=document.querySelector(`.qcard[data-qid="${q.id}"]`);
  if(!card)return;
  if(q.ty==="mc"){const r=card.querySelector("input[type=radio]:checked");testState.answers[q.id]=r?Number(r.value):undefined;}
  else if(q.ty==="ms"){testState.answers[q.id]=[...card.querySelectorAll("input[type=checkbox]:checked")].map(c=>Number(c.value));}
  else if(q.ty==="match"){const obj={};card.querySelectorAll("select[data-mi]").forEach(s=>{if(s.value!=="")obj[s.dataset.mi]=s.value;});testState.answers[q.id]=obj;}
  else if(q.ty==="sa"){const t=card.querySelector("textarea");testState.answers[q.id]=t?t.value:"";testState._saSelf=testState._saSelf||{};const checked=card.querySelector("[data-self].active");}
}
function wireRun(){
  if(!testState)return;
  const q=QUESTIONS.find(x=>x.id===testState.ids[testState.idx]);
  document.querySelectorAll("[data-bm]").forEach(b=>b.onclick=()=>{toggleBookmark(b.dataset.bm);b.classList.toggle("on");});
  document.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{document.querySelector(`[data-model="${b.dataset.reveal}"]`).classList.remove("hidden");});
  document.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{
    testState.saSelf=testState.saSelf||{};testState.saSelf[b.dataset.self]=b.dataset.val==="1";
    b.parentElement.querySelectorAll("[data-self]").forEach(x=>x.style.opacity=.5);b.style.opacity=1;
  });
  document.querySelectorAll("[data-selfpts]").forEach(s=>s.onchange=()=>{testState.saSelf=testState.saSelf||{};testState.saSelf[s.dataset.selfpts]=Number(s.value);});const prev=document.getElementById("prev-q"),next=document.getElementById("next-q"),fin=document.getElementById("finish-test");
  if(prev)prev.onclick=()=>{captureAnswer(q);testState.idx--;go("run");render();};
  if(next)next.onclick=()=>{captureAnswer(q);testState.idx++;go("run");render();};
  if(fin)fin.onclick=()=>{captureAnswer(q);finishTest();};
  if(testState.timed && !testState.timerId){
    testState.timerId=setInterval(()=>{
      testState.secondsLeft--;
      const el=document.getElementById("timer");
      if(el)el.textContent=fmtTime(testState.secondsLeft);
      if(testState.secondsLeft<=0){clearInterval(testState.timerId);captureAnswer(q);finishTest();}
    },1000);
  }
}
function gradeQuestion(q,ans){
  if(q.ty==="mc")return ans===q.a;
  if(q.ty==="ms"){if(!ans)return false;const a=[...ans].sort().join(",");return a===[...q.a].sort().join(",");}
  if(q.ty==="match"){if(!ans)return false;return q.left.every((l,i)=>Number(ans[i])===q.a[i]);}
  if(q.ty==="sa")return !!(testState.saSelf&&testState.saSelf[q.id]);
  return false;
}
function finishTest(){
  if(testState.timerId)clearInterval(testState.timerId);
  const qs=testState.ids.map(id=>QUESTIONS.find(q=>q.id===id));
  let correct=0,poss=0;const byUnit={},byComp={},byTopic={};
  qs.forEach(q=>{
    const pe=earned(q,testState.answers[q.id]),pp=pts(q),ok=pe>=pp*0.6;
    correct+=pe;poss+=pp;if(ok)missed.delete(q.id);else missed.add(q.id);
    addTo(byUnit,q.u,pe,pp);
    addTo(byComp,q.c,pe,pp);addTo(byTopic,q.t,pe,pp);
  });
  save(LS.miss,[...missed]);
  const attempt={date:new Date().toISOString(),ids:testState.ids,answers:testState.answers,saSelf:testState.saSelf||{},score:correct,total:poss,nq:qs.length,mode:testState.mode||"Custom test",byUnit,byComp,byTopic};
  attempts.push(attempt);save(LS.att,attempts);
  testState.reviewAttempt=attempt;reviewAtt=attempt;
  go("review");
}

// ---------- review ----------
function viewReview(){
  const a=reviewAtt||attempts[attempts.length-1];
  if(!a)return `<div class="card"><p>No completed test to review yet.</p><button class="btn" data-go="setup">Start a test</button></div>`;
  const qs=a.ids.map(id=>QUESTIONS.find(q=>q.id===id));
  return `<div class="card">
    <h2>Test Review</h2>${cheer(a)}
    <p>Score: <strong>${a.score} / ${a.total} points</strong> (${Math.round(100*a.score/a.total)}%). A single score is a snapshot, not a full picture - check the breakdown below and in Results to see trends.</p>
    ${bars(a.byUnit,UNITS)}${bars(a.byTopic||{})}<div class="row" style="margin-top:.6em"><button class="btn secondary" data-go="dashboard">See dashboard and trends</button><button class="btn ghost" data-go="setup">Take another test</button></div>
  </div>
  ${qs.map(q=>renderQuestionBlock(q,{mode:"review",userAns:(q.ty==="sa"?a.answers[q.id]:a.answers[q.id]),showAnswer:true})).join("")}`;
}

// ---------- results ----------
function viewResultsOld(){
  if(!attempts.length)return `<div class="card"><h2>Results</h2><p class="empty">No attempts yet. Take a practice test to start tracking your progress, love.</p><button class="btn" data-go="setup">Start a practice test</button></div>`;
  const unitAgg={};
  attempts.forEach(a=>Object.entries(a.byUnit).forEach(([u,s])=>{unitAgg[u]=unitAgg[u]||{correct:0,total:0};unitAgg[u].correct+=s.correct;unitAgg[u].total+=s.total;}));
  return `<div class="card">
    <h2>Progress by Unit</h2>
    ${Object.entries(unitAgg).map(([u,s])=>{const pct=Math.round(100*s.correct/s.total);return `<div class="bar-row"><span style="width:12em">${UNITS[u]}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;}).join("")}
    <p style="margin-top:.8em">Combines all attempts to date. Use this to see which units need more practice, not as a single definitive grade.</p>
  </div>
  <div class="card">
    <h2>Attempt History</h2>
    ${attempts.slice().reverse().map((a,i)=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border);padding:.4em 0">
      <span>${new Date(a.date).toLocaleDateString()} ${new Date(a.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
      <span>${a.score}/${a.total} (${Math.round(100*a.score/a.total)}%)</span></div>`).join("")}
  </div>
  <div class="card">
    <h3>Keep practicing</h3>
    <p>Review bookmarked or previously missed questions any time from the Question Bank filters.</p>
    <button class="btn secondary" data-go="bank">Open question bank</button>
  </div>`;
}

// ---------- about ----------
function viewAbout(){
  return `<div class="card">
    <h2>About this site</h2>
    <p>This is an independent, student-made study resource organized around a publicly listed set of BIO 101 (General Biology I) topics and learning goals. It is <strong>not produced, reviewed, or endorsed by NOVA</strong>, and no questions or text are copied from any NOVA course materials - every question and explanation here was written from scratch for this project.</p>
    <h3>Scope and assumptions</h3>
    <p>The question bank covers a representative sample of each of the five units (Overview of Biology, Chemistry of Life, The Cell, Molecular Biology &amp; Genetics, and Evolution) rather than every possible subtopic, so it should be used alongside your actual course materials, not as a replacement for them. Matching questions assume a one-to-one pairing between the terms shown. Short-answer questions are open-ended, so they are self-graded: you compare your own answer to a model answer rather than receiving automatic scoring.</p>
    <h3>Why this site exists</h3><p>I made this website to assist my girlfriend with her BIO101 course preparation. She is a lovely, hardworking, and beautiful girl (I'm super lucky). She is also the best support in Marvel Rivals (2%). This website exists because I want to help her achieve her goal of becoming a nurse. I love you, baby.</p><h3>Alignment with the course</h3><p><strong>Study references:</strong> this update also draws on two documents supplied by me, a practice exams and study guides. They were used only as references for topics, point values, and the mix of multiple-choice, short-answer, and long-answer formats.</p><p>Every question is tagged by unit, topic, and core competency, with topics matching the objectives in the publicly listed course scope.<h3>How it works</h3>
    <p>This is a single, self-contained web page - there is nothing to install and no server is required. All of your bookmarks, missed questions, and test history are stored only in this browser's local storage, which means your progress stays on this device and is not sent anywhere. Clearing your browser data will reset your history.</p>
  </div>`;
}

// ---------- wiring ----------
function wireQuestionCards(mode){
  document.querySelectorAll("[data-bm]").forEach(b=>b.onclick=()=>{toggleBookmark(b.dataset.bm);b.classList.toggle("on");});
  document.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{document.querySelector(`[data-model="${b.dataset.reveal}"]`).classList.remove("hidden");});
  document.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll("[data-self]").forEach(x=>x.style.opacity=.5);b.style.opacity=1;});
  if(mode==="bank"){
    document.querySelectorAll("[data-check]").forEach(btn=>btn.onclick=()=>{
      const id=btn.dataset.check,q=QUESTIONS.find(x=>x.id===id),card=document.querySelector(`.qcard[data-qid="${id}"]`);
      let ans;
      if(q.ty==="mc"){const r=card.querySelector("input[type=radio]:checked");ans=r?Number(r.value):undefined;}
      else if(q.ty==="ms"){ans=[...card.querySelectorAll("input[type=checkbox]:checked")].map(c=>Number(c.value));}
      else if(q.ty==="match"){ans={};card.querySelectorAll("select[data-mi]").forEach(s=>{if(s.value!=="")ans[s.dataset.mi]=s.value;});}
      if(q.ty!=="sa"){
        const ok=q.ty==="mc"?ans===q.a:q.ty==="ms"?([...ans].sort().join(",")===[...q.a].sort().join(",")):q.left.every((l,i)=>Number(ans[i])===q.a[i]);
        if(!ok)missed.add(id);else missed.delete(id);save(LS.miss,[...missed]);
        if(q.ty==="mc"){card.querySelectorAll("input[type=radio]").forEach((r,i)=>{r.disabled=true;const lbl=r.parentElement;if(i===q.a)lbl.classList.add("correct");else if(r.checked)lbl.classList.add("wrong");});}
        else if(q.ty==="ms"){card.querySelectorAll("input[type=checkbox]").forEach((c,i)=>{c.disabled=true;const lbl=c.parentElement;if(q.a.includes(i))lbl.classList.add("correct");else if(c.checked)lbl.classList.add("wrong");});}
        else if(q.ty==="match"){card.querySelectorAll("select[data-mi]").forEach(s=>{s.disabled=true;const i=s.dataset.mi;const good=Number(ans[i])===q.a[i];s.insertAdjacentHTML("afterend",good?' <span style="color:var(--good)">correct</span>':' <span style="color:var(--bad)">not quite</span>');});}
      }
      document.querySelector(`[data-explain="${id}"]`).classList.remove("hidden");
    });
  }
}
function wireView(r){
  if(r==="bank"){["f-unit","f-t","f-c","f-ty","f-d","f-bm","f-miss","f-n"].forEach(id=>document.getElementById(id).onchange=refreshBankList);refreshBankList();}
  else if(r==="setup")wireSetup();
  else if(r==="run")wireRun();
}

render();
</script>
</body>
</html>
